name: TGT Deal Watcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tgt-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw2-${{ runner.os }}-v1

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install patchright beautifulsoup4 requests
          python -m patchright install --with-deps chromium

      - name: Run watcher
        run: xvfb-run -a python watch.py

      - name: Save state
        run: |
          git config user.name "tgt-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json
          git diff --quiet --cached || git commit -m "update seen state"
          git pull --rebase --autostash
          git push
